name: CI and container deployment

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check syntax
        run: npm run check

      - name: Run tests and create report
        run: |
          mkdir -p test-results
          node --test --test-reporter=tap | tee test-results/results.tap

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/results.tap
          retention-days: 7

  container:
    name: Build container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build multi-stage image
        run: docker build --tag az400-lab:${{ github.sha }} .

  deploy:
    name: Push and deploy to Azure
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ACR_LOGIN_SERVER != '' && vars.AZURE_WEBAPP_NAME != ''
    needs: container
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/az400-actions-lab:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/az400-actions-lab:latest

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ vars.ACR_LOGIN_SERVER }}/az400-actions-lab:${{ github.sha }}
