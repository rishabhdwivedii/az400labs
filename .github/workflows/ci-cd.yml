name: CI and container deployment

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check syntax
        run: npm run check

      - name: Run tests and create report
        run: |
          mkdir -p test-results
          node --test --test-reporter=tap | tee test-results/results.tap

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/results.tap
          retention-days: 7

  container:
    name: Build container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build multi-stage image
        run: docker build --tag az400-lab:${{ github.sha }} .

  deploy:
    name: Push and deploy to Azure
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' && vars.ACR_NAME != '' && vars.ACR_LOGIN_SERVER != '' && vars.AZURE_WEBAPP_NAME != ''
    needs: container
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_RESOURCE_GROUP: rg-az400-actions-lab
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/az400-actions-lab:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/az400-actions-lab:latest

      - name: Configure managed identity image pulls
        run: |
          az webapp config set \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.AZURE_WEBAPP_NAME }} \
            --generic-configurations '{"acrUseManagedIdentityCreds": true}'

      - name: Deploy container to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ vars.ACR_LOGIN_SERVER }}/az400-actions-lab:${{ github.sha }}
